<!DOCTYPE html>
<html lang="en">
<head>
    {% if title %}
    <title>{{ title }}Microblog</title>
    {% else %}
    <title>Welcome to Microblog</title>
    {% endif %}
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
        <h1>Hello, {{ user.username }}!</h1>
        {% for posts in posts %}
        <div><p>{{ posts.author.username }} says: <b>{{ posts.body }}</b></p></div>
        {% endfor %}
    {% endblock %}    
</body>
</html>
